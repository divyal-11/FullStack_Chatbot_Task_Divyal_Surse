services:
  - type: web
    name: dronetv-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dronetv-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: dronetv-db
    plan: free
